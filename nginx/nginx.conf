worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # NOTE: add_header directives are only inherited by a nested block when
    # that block declares none of its own, so all security headers live in the
    # server {} block below where they are guaranteed to apply to every response.

    server {
        listen 80;
        server_name localhost;

        # ── Security Headers ───────────────────────────────────────────────
        # Force browsers to use HTTPS for this site and all subdomains for the
        # next year, preventing SSL-strip / HTTP downgrade attacks in production.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Stop browsers from MIME-sniffing responses into an unexpected type,
        # which blocks drive-by downloads and content-type confusion attacks.
        add_header X-Content-Type-Options "nosniff" always;

        # Refuse to let any other site frame this app in a frame or iframe,
        # blocking clickjacking attacks.
        add_header X-Frame-Options "DENY" always;

        # Legacy XSS filter for older browsers; harmless where unsupported.
        add_header X-XSS-Protection "1; mode=block" always;

        # Control how much referrer information is sent along with requests.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrict resource loading, script execution and framing to this
        # origin to mitigate XSS and data-exfiltration attacks. Mirrors
        # frontend/next.config.mjs (static export cannot emit Next headers).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self' http://localhost:4000 https://horizon.stellar.org https://horizon-testnet.stellar.org https://friendbot.stellar.org https://soroban.stellar.org https://soroban-testnet.stellar.org https://api.coingecko.com;" always;

        # Frontend Static Files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend API Proxying
        location /api/ {
            proxy_pass http://backend:4000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 'OK';
        }
    }
}
