version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - frontend_static:/usr/share/nginx/html
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=mainnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon.stellar.org
      - NEXT_PUBLIC_API_URL=https://stellarmicropay.io/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - proxy
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - PORT=4000
      - NODE_ENV=production
      - STELLAR_NETWORK=mainnet
      - HORIZON_URL=https://horizon.stellar.org
      - ALLOWED_ORIGINS=https://stellarmicropay.io
      - FEDERATION_DOMAIN=stellarmicropay.io
      - FEDERATION_DOMAINS=stellarmicropay.io,stellarmicropay.com
      - REDIS_URL=redis://redis:6379
      - ANALYTICS_CACHE_TTL_MS=300000
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - jwt_secret
      - server_private_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - frontend
      - backend

volumes:
  frontend_static:
  redis_data:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  server_private_key:
    file: ./secrets/server_private_key.txt

networks:
  proxy:
    driver: bridge
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
