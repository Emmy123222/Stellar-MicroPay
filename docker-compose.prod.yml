version: "3.9"

services:
  nginx:
    image: nginx:alpine
    # Non-root ingress proxy: nginx alpine uid/gid. The official entrypoint
    # rewrites /etc/nginx/conf.d, so it is bypassed and nginx launched directly.
    user: "101:101"
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:exec
      - /var/cache/nginx:exec
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    read_only: true
    tmpfs:
      - /tmp:exec
      - /var/cache/nginx:exec
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - frontend_static:/usr/share/nginx/html:ro
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=mainnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon.stellar.org
      - NEXT_PUBLIC_API_URL=https://stellarmicropay.io/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - proxy
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    read_only: true
    tmpfs:
      - /tmp:exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PORT=4000
      - NODE_ENV=production
      - STELLAR_NETWORK=mainnet
      - HORIZON_URL=https://horizon.stellar.org
      - ALLOWED_ORIGINS=https://stellarmicropay.io
      - FEDERATION_DOMAIN=stellarmicropay.io
      - FEDERATION_DOMAINS=stellarmicropay.io,stellarmicropay.com
    secrets:
      - jwt_secret
      - server_private_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - frontend
      - backend

volumes:
  frontend_static:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  server_private_key:
    file: ./secrets/server_private_key.txt

networks:
  proxy:
    driver: bridge
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
