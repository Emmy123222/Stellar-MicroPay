version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - proxy

  frontend:
    image: ghcr.io/chidubemkingsley/stellar-micropay-frontend:staging
    volumes:
      - frontend_static:/usr/share/nginx/html
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_API_URL=https://staging.stellarmicropay.io/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - proxy
      - frontend

  backend:
    image: ghcr.io/chidubemkingsley/stellar-micropay-backend:staging
    environment:
      - PORT=4000
      - NODE_ENV=staging
      - STELLAR_NETWORK=testnet
      - HORIZON_URL=https://horizon-testnet.stellar.org
      - ALLOWED_ORIGINS=https://staging.stellarmicropay.io
      - FEDERATION_DOMAIN=stellarmicropay.io
      - FEDERATION_DOMAINS=stellarmicropay.io,stellarmicropay.com
    secrets:
      - jwt_secret
      - server_private_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - frontend
      - backend

volumes:
  frontend_static:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  server_private_key:
    file: ./secrets/server_private_key.txt

networks:
  proxy:
    driver: bridge
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true