name: Secret Scanning (scheduled)

# Weekly full-history secret sweep.
#
# Per-push and per-PR scanning lives in the `gitleaks` job in ci.yml — this
# workflow deliberately does not duplicate those runs. What it adds is a
# scheduled re-scan: gitleaks ships new detection rules continuously, so a
# commit that was clean when it landed can start failing weeks later. This job
# re-reads the entire history against the current ruleset and surfaces that.

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PR/push scans cover every new commit, not just HEAD.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional org/enterprise licence key; safe to leave unset for OSS repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
