name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check below diffs against a parent (push) or the base branch
          # (pull request). The default depth-1 clone has neither, so `HEAD^`
          # resolved to "unknown revision" and the job failed on every event.
          fetch-depth: 0

      - name: Reject whitespace errors and unresolved conflicts
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Everything this PR adds, relative to where it forked off the base.
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse --verify -q 'HEAD^' >/dev/null; then
            range='HEAD^'
          else
            # Root commit on a freshly pushed branch: nothing to compare against.
            range='HEAD'
          fi

          echo "Checking whitespace in: ${range}"
          git diff --check "${range}"

          echo "Checking for unresolved merge conflict markers"
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)'

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

  backend:
    name: Backend (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  contracts:
    name: Soroban contract (check, test, WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2

      # soroban-sdk >= 25.x refuses to compile for a wasm target unless the
      # build system sets SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2.
      # Only stellar-cli sets it, and it is not optional bookkeeping: the SDK
      # shakes the contract spec during the build, so a plain `cargo build`
      # would emit a wasm whose spec is wrong. Build through the CLI instead.
      - name: Install stellar-cli
        env:
          # Keep in step with the soroban-sdk major in
          # contracts/stellar-micropay-contract/Cargo.toml.
          STELLAR_CLI_VERSION: "28.0.0"
        run: |
          set -euo pipefail

          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version

      # Type-check and unit-test against the host target: the wasm target is
      # covered by the CLI build below. --locked keeps Cargo.lock authoritative,
      # so a manifest bump that forgets the lockfile fails here instead of
      # silently re-resolving at build time.
      - run: cargo check --locked --workspace
      - run: cargo test --locked --workspace

      - name: Build contract wasm
        run: |
          stellar contract build \
            --manifest-path contracts/stellar-micropay-contract/Cargo.toml \
            --locked

      - uses: actions/upload-artifact@v4
        with:
          name: stellar-micropay-contract-wasm
          path: target/wasm32v1-none/release/stellar_micropay_contract.wasm
          if-no-files-found: error

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
