name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── EditorConfig ──────────────────────────────────────────────────────────
  editorconfig:
    name: EditorConfig Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check EditorConfig compliance
        uses: editorconfig-checker/action-editorconfig-checker@main

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache Node dependencies
        id: cache-node
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          START_TIME=$(date +%s%N)
          npm ci
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          DURATION_SEC=$(awk "BEGIN {printf \"%.2f\", $DURATION_MS/1000}")
          echo "Frontend install duration: ${DURATION_SEC}s"
          HIT="${{ steps.cache-node.outputs.cache-hit }}"
          echo "### 🚀 Frontend Dependency Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Hit**: \`${HIT:-false}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: \`Node ${{ steps.setup-node.outputs.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lockfile**: \`frontend/package-lock.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Install Duration (Cold vs Warm)**: \`${DURATION_SEC}s\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for unused dependencies
        run: npx depcheck --ignores="@storybook/*,prettier" --ignore-dirs=.next,.storybook

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Bundle size budget
        run: npm run size

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache Node dependencies
        id: cache-node
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          START_TIME=$(date +%s%N)
          npm ci
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          DURATION_SEC=$(awk "BEGIN {printf \"%.2f\", $DURATION_MS/1000}")
          echo "Backend install duration: ${DURATION_SEC}s"
          HIT="${{ steps.cache-node.outputs.cache-hit }}"
          echo "### 🚀 Backend Dependency Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Hit**: \`${HIT:-false}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: \`Node ${{ steps.setup-node.outputs.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lockfile**: \`backend/package-lock.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Install Duration (Cold vs Warm)**: \`${DURATION_SEC}s\`" >> $GITHUB_STEP_SUMMARY

      - name: Check for unused dependencies
        run: npx depcheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ─── Contracts ─────────────────────────────────────────────────────────────
  contracts:
    name: Soroban Contracts (Rust)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts/stellar-micropay-contract

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache cargo dependencies
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-${{ steps.rust-version.outputs.version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-version.outputs.version }}-cargo-
            ${{ runner.os }}-rust-

      - name: Check, Test, and Build WASM
        run: |
          START_TIME=$(date +%s%N)
          cargo check --target wasm32-unknown-unknown
          cargo test
          cargo build --target wasm32-unknown-unknown --release
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          DURATION_SEC=$(awk "BEGIN {printf \"%.2f\", $DURATION_MS/1000}")
          echo "Cargo execution duration: ${DURATION_SEC}s"
          HIT="${{ steps.cache-cargo.outputs.cache-hit }}"
          echo "### 🚀 Soroban Contracts Cargo Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Hit**: \`${HIT:-false}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: \`Rust ${{ steps.rust-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lockfile**: \`Cargo.lock\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Duration (Cold vs Warm)**: \`${DURATION_SEC}s\`" >> $GITHUB_STEP_SUMMARY

  # ─── E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache Node dependencies
        id: cache-node
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          START_TIME=$(date +%s%N)
          npm ci
          END_TIME=$(date +%s%N)
          DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          DURATION_SEC=$(awk "BEGIN {printf \"%.2f\", $DURATION_MS/1000}")
          echo "E2E install duration: ${DURATION_SEC}s"
          HIT="${{ steps.cache-node.outputs.cache-hit }}"
          echo "### 🚀 E2E Node Dependency Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Hit**: \`${HIT:-false}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: \`Node ${{ steps.setup-node.outputs.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lockfile**: \`frontend/package-lock.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Install Duration (Cold vs Warm)**: \`${DURATION_SEC}s\`" >> $GITHUB_STEP_SUMMARY

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

