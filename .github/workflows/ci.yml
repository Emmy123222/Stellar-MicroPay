name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject whitespace errors and unresolved conflicts
        run: |
          git diff --check HEAD^
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)'

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

  backend:
    name: Backend (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  contracts:
    name: Soroban contract (check, test, WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # soroban-sdk 28 refuses to build for wasm unless its build script sees
      # SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2, which only
      # `stellar contract build` (stellar-cli v25.2.0+) sets. Install the CLI
      # (prebuilt binary; bump the version alongside soroban-sdk) and build
      # the WASM through it instead of plain `cargo build --target`.
      - name: Install stellar-cli
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-1-3
          case "$(uname -m)" in
            x86_64) arch=x86_64-unknown-linux-gnu ;;
            aarch64) arch=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          version=28.0.0
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            "https://github.com/stellar/stellar-cli/releases/download/v${version}/stellar-cli-${version}-${arch}.tar.gz" \
            | tar -xz -C /usr/local/bin
          chmod +x /usr/local/bin/stellar
          stellar --version
      - run: cargo check
      - run: cargo test
      - run: stellar contract build
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-micropay-contract-wasm
          path: target/wasm32v1-none/release/stellar_micropay_contract.wasm
          if-no-files-found: error

  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
