name: Lighthouse CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", "lighthouserc.json", ".github/workflows/lighthouse-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", "lighthouserc.json", ".github/workflows/lighthouse-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Start static site
        run: |
          npm run start > "$RUNNER_TEMP/frontend-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/frontend-server.log"
          exit 1
      - name: Audit primary routes with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://localhost:3000/
            http://localhost:3000/dashboard
            http://localhost:3000/pay
          uploadArtifacts: true
          temporaryPublicStorage: true
