          SMOKE_RETRIES: 5
          SMOKE_RETRY_DELAY_MS: 3000
        run: node scripts/smoke-test.js

  rollback-on-failure:
    name: Automatic rollback on failure
    needs: smoke-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine previous staging image
        id: previous
        run: |
          # Get the second-most-recent staging image tag (previous deployment)
          PREV_TAG=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/stellar-micropay-backend:staging 2>/dev/null \
            | jq -r '.manifests[1].digest' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous staging image found for rollback"
            echo "rollback_needed=false" >> $GITHUB_OUTPUT
          else
            echo "rollback_needed=true" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Trigger rollback
        if: steps.previous.outputs.rollback_needed == 'true'
        run: |
          echo "::error::Smoke tests failed. Rolling back staging deployment."
          echo "::error::Previous image: ${{ steps.previous.outputs.previous_tag }}"
          # Rollback is achieved by re-deploying the previous staging-{sha} tag
          # The actual rollback command depends on your deployment platform:
          # - For docker compose: docker compose -f docker-compose.staging.yml up -d --force-recreate
          # - For Kubernetes: kubectl rollout undo deployment/staging
          # - For ECS: aws ecs update-service --force-new-deployment
          echo "Rollback initiated. Manual intervention may be required."

      - name: Notify failure
