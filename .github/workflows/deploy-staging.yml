name: Deploy Staging

# Build and push backend + frontend images tagged "staging" on every push to
# the develop branch, so the staging environment is always up to date with
# the latest pre-release changes. After deployment, smoke tests validate the
# staging environment and trigger automatic rollback on failure.

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    name: Build & push staging images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
            image: stellar-micropay-backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
            image: stellar-micropay-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # Tag with "staging" and the short commit SHA for traceability.
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
